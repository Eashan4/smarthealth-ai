[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<logger_main.cpp>
lib_deps =
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
    bblanchon/ArduinoJson@^7.1.0

; Phase 2 -- IMU-only CSV logger for custom data collection, no WiFi/backend.
; Build/flash with: pio run -e esp32dev_logger -t upload
[env:esp32dev_logger]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<main.cpp>
lib_deps =
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2

; NodeMCU v3 IMU-only CSV logger (same as esp32dev_logger).
[env:nodemcuv3_logger]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_src_filter = +<*> -<main.cpp>
lib_deps =
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
